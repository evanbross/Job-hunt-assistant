<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 320px;
      min-height: 130px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e40af;
      color: #fff;
      padding: 10px 14px;
    }
    .header-icon { font-size: 18px; line-height: 1; }
    .header-title { font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }

    .body { padding: 14px 14px 10px; }

    .site-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 3px;
      color: #0f172a;
    }
    .site-desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 9px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      color: #2563eb;
      border: 1.5px solid #2563eb;
      margin-top: 8px;
    }
    .btn.secondary:hover:not(:disabled) { background: #eff6ff; }

    .status-row {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }
    .status-row.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .status-row.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-row.info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    .progress-wrap { margin-top: 8px; display: none; }
    .progress-label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .progress-bar {
      width: 100%;
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .full-desc-options {
      margin-top: 4px;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12.5px;
      color: #475569;
    }
    .full-desc-options .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .full-desc-options .cap-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding-left: 20px;
    }
    .full-desc-options .cap-row input[type="number"] {
      width: 60px;
      padding: 2px 5px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12.5px;
    }

    .capture-mode-row {
      display: flex;
      margin-bottom: 10px;
      border: 1px solid #2563eb;
      border-radius: 6px;
      overflow: hidden;
    }
    .capture-mode-row button {
      flex: 1;
      padding: 6px 8px;
      border: none;
      background: #fff;
      color: #2563eb;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .capture-mode-row button + button { border-left: 1px solid #2563eb; }
    .capture-mode-row button.active { background: #2563eb; color: #fff; }

    .footer {
      padding: 4px 14px 8px;
      text-align: right;
    }
    .footer a {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover { color: #2563eb; }

    /* Spinner inline with button text */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #no-access {
      padding: 20px 14px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🎯</span>
    <span class="header-title">Job Hunt Assistant</span>
  </div>

  <div id="main-body" class="body">
    <div class="site-name" id="site-name">Scanning page…</div>
    <div class="site-desc" id="site-desc"></div>

    <div class="capture-mode-row" id="capture-mode-row" style="display:none;">
      <button type="button" id="capture-mode-list" data-mode="list">All results</button>
      <button type="button" id="capture-mode-detail" data-mode="detail">This job only</button>
    </div>

    <div class="full-desc-options" id="full-desc-options" style="display:none;">
      <label class="checkbox-row">
        <input type="checkbox" id="full-desc-checkbox">
        Fetch full descriptions (slower)
      </label>
      <div class="cap-row" id="full-desc-cap-row" style="display:none;">
        <label for="full-desc-fetch-cap">Max jobs to fetch:</label>
        <input type="number" id="full-desc-fetch-cap" min="1" max="500">
      </div>
    </div>

    <button class="btn" id="send-btn" disabled>Please wait…</button>
    <button class="btn secondary" id="fill-app-btn" style="display:none;">Fill Application</button>

    <div class="status-row" id="status-row"></div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label" id="progress-label"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div id="no-access">
    Cannot access this page.<br>Open a job board and try again.
  </div>

  <div class="footer">
    <a id="settings-link">&#9881; Settings</a>
  </div>

  <script src="extension-auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
