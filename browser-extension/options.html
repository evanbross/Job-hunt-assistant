<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Hunt Assistant — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      min-width: 380px;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      color: #1e40af;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 5px;
      font-size: 13px;
      color: #0f172a;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 14px;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #2563eb;
    }
    input[type="text"]:last-child, input[type="password"]:last-child { margin-bottom: 0; }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; }
    .btn-secondary:hover { background: #e2e8f0; }
    #status {
      margin-top: 12px;
      font-size: 13px;
      padding: 7px 10px;
      border-radius: 5px;
      display: none;
    }
    #status.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    #status.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    #status.info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>
  <h1><span>🎯</span> Job Hunt Assistant Settings</h1>

  <div class="card">
    <div class="card-title">Import Listener</div>

    <label for="listener-url">Listener URL</label>
    <div class="hint">Where the extension POSTs captured jobs (matches IMPORT_LISTENER_PORT in your .env)</div>
    <input type="text" id="listener-url" placeholder="http://localhost:8765">

    <label for="token">Auth Token (optional)</label>
    <div class="hint">Leave blank if IMPORT_LISTENER_TOKEN is not set</div>
    <input type="password" id="token" placeholder="Leave blank if not configured">
  </div>

  <div class="card">
    <div class="card-title">App URL</div>

    <label for="app-url">Job Hunt App URL</label>
    <div class="hint">Opened when you click "Open Job Hunt App" after a successful send</div>
    <input type="text" id="app-url" placeholder="http://localhost:5000">
  </div>

  <div class="row">
    <button class="btn btn-primary" id="save-btn">Save</button>
    <button class="btn btn-secondary" id="test-btn">Test Connection</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
