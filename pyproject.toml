[project]
name = "job-hunt-assistant"
version = "0.1.0"
description = "AI-powered job hunt assistant with Gmail integration and Google Sheets logging"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.6.17",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flasgger>=0.9.7.1",
    "anthropic>=0.40.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "python-docx>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "celery[redis]>=5.3.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    "celery-types>=0.26.0",
    "black>=26.5.1",
    "websockets>=12.0",
    "sqlglot>=25.0.0",
    "cryptography>=42.0.0",
    "watchdog>=6.0.0",
    "gunicorn>=23.0.0 ; sys_platform != 'win32'",
    "boto3>=1.40",
    "sentry-sdk>=2.40",
    "nh3>=0.3.7",
    "tzdata>=2026.2",
    # Shared ZombieTech code (Caddy registration, SMTP) from the sibling ../infra repo.
    # The image build gets it as a named build context (Dockerfile, scripts/release.py).
    "zt-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "moto[s3]>=5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
]
[tool.uv.sources]
zt-common = { path = "../infra/zt-common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tmp", ".venv", "frontend"]
markers = [
    "live: hits real, currently-live external job-board URLs over the network. Never runs in CI or a bare `pytest` invocation — opt in explicitly with `RUN_LIVE_JD_TESTS=1 pytest -m live`.",
]
addopts = "-m \"not live\""

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",   # pyflakes — undefined names, unused imports
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # line too long — handled by formatter separately
]

