# Production reference: reverse proxy + broker + app/worker, with the network split so
# that only Caddy is reachable from outside and Redis is reachable from nothing but
# the app and workers. See deploy/README.md before using; it lists what this does NOT
# include.
#
#   docker build -t <registry>/job-hunt-assistant:<version> .     # the repo's Dockerfile
#   cp deploy/.env.production.example deploy/.env.production      # then fill it in (JHA_IMAGE = that tag)
#   cp deploy/.env.migrate.example deploy/.env.migrate            # the owner's DB URL
#   python scripts/generate_redis_tls.py                          # once
#   # every deploy: migrate first, then (re)start the app
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Differences from ../infra (the shared DEV stack) on purpose:
#   * no MailHog, no MinIO, no Caddy admin API ("admin off" in the Caddyfile)
#   * Redis requires a password AND TLS, has no published port, and sits on an
#     internal-only network with no route to the internet
#   * nothing is bound to a host port except Caddy's 80/443
#   * every secret is a required variable: compose refuses to start without it

name: jha-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, the public host name (e.g. jobs.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL, the address Let's Encrypt can reach you at}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # issued certificates; losing it forces re-issuance
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:                    # edge: to the app; egress: to reach Let's Encrypt
      edge:
        ipv4_address: 172.28.0.2   # fixed: the app trusts forwarding headers from this address only
      egress: {}
    depends_on:                  # ai: claude-opus-5-5 | 2026-11-06 -- only once they can serve
      app:
        condition: service_healthy
      listener:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # TLS only (plain port disabled). The password is read by the container's shell
    # from its environment, so it never appears in the command line compose records.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --port 0
        --tls-port 6379
        --tls-cert-file /tls/redis.crt
        --tls-key-file /tls/redis.key
        --tls-ca-cert-file /tls/ca.crt
        --tls-auth-clients no
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
      - ./secrets/redis-tls:/tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --tls --cacert /tls/ca.crt -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
    # Run as the image's unprivileged user from the start. (With `command: sh -c ...` the
    # image entrypoint's drop-from-root step is bypassed, so it must not start as root.)
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]                # internal-only: no published port, no internet route

  # ai: claude-opus-5-5 | 2026-11-06
  # Every service below runs the image built from the repository's Dockerfile; the
  # command names which process (deploy/docker-entrypoint.sh).
  app:
    image: ${JHA_IMAGE:?set JHA_IMAGE, the tag the Dockerfile was built as}
    restart: unless-stopped
    # wsgi.py refuses to start until `migrate` (below) has run for this image's version.
    # Capacity is GUNICORN_WORKERS x GUNICORN_THREADS connections; see gunicorn.conf.py.
    command: ["web"]
    env_file: .env.production
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS_CA_FILE: /tls/ca.crt
      # The voice-query role's password: the value migrate set (backend/db/readonly_role.py).
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD}
      # gunicorn.conf.py binds 0.0.0.0:5004 inside the container network; Caddy is the
      # only thing that reaches it.
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
      # The one proxy allowed to say which client address/scheme a request had
      # (X-Forwarded-For / -Proto). Must equal Caddy's pinned address on `edge`.
      TRUSTED_PROXIES: 172.28.0.2
    volumes:
      - ./secrets/redis-tls/ca.crt:/tls/ca.crt:ro
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge, backend, egress]  # egress: Postgres, the AI providers, Gmail
    # Readiness: the database and Redis both answer (routes/system.py). Caddy waits for it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/api/system/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # The browser extension's HTTP listener (:8765) and capture-queue WebSocket (:8766),
  # as their own process (python -m web.extension_listener), so a web worker restart
  # never drops them and only one process binds the ports. It refuses to start on a
  # port other than the configured ones, since Caddy's upstreams below are fixed.
  listener:
    image: ${JHA_IMAGE:?set JHA_IMAGE}
    restart: unless-stopped
    command: ["listener"]
    env_file: .env.production
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS_CA_FILE: /tls/ca.crt
      # The listener host only seeds system_settings on a brand-new DB (ON CONFLICT DO
      # NOTHING) -- a DB migrated from desktop use already has 127.0.0.1 persisted. The
      # _OVERRIDE forces the bind regardless; see its comment in config.py.
      JOB_IMPORT_LISTENER_HOST_OVERRIDE: 0.0.0.0
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
      TRUSTED_PROXIES: 172.28.0.2      # same rule as the app: only Caddy may forward
    volumes:
      - ./secrets/redis-tls/ca.crt:/tls/ca.crt:ro
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge, backend, egress]  # edge: Caddy; backend: Redis/Celery; egress: Postgres
    healthcheck:                       # its unauthenticated /health (import_listener.py)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # One-shot deploy step, not a long-running service: the `migrate` profile keeps it out
  # of `up`. It and `maintenance` are the only services given the schema owner's URL
  # (.env.migrate); app, listener and worker serve as the runtime role in DATABASE_URL,
  # which RLS always applies to.
  migrate:
    image: ${JHA_IMAGE:?set JHA_IMAGE}
    profiles: ["migrate"]
    restart: "no"
    command: ["migrate"]
    env_file:
      - .env.production
      - .env.migrate
    environment:
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
      # Sets the voice-query role's password to this; the app connects with the same value.
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD}
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [egress]                 # Postgres only

  # Every background task except the maintenance sweep (default queue only).
  worker:
    image: ${JHA_IMAGE:?set JHA_IMAGE}
    restart: unless-stopped
    command: ["worker"]                # CELERY_CONCURRENCY threads, default 4
    env_file: .env.production
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS_CA_FILE: /tls/ca.crt
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
    volumes:
      - ./secrets/redis-tls/ca.crt:/tls/ca.crt:ro
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    shm_size: 512m                     # headless Chromium's shared memory (Greenhouse search)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend, egress]        # not reachable from the internet at all
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # The account-deletion / log-retention sweep, which acts across every account and so
  # needs the schema owner's URL. A worker of its own so that credential sits in one
  # small process that runs nothing else, instead of in every task worker.
  maintenance:
    image: ${JHA_IMAGE:?set JHA_IMAGE}
    restart: unless-stopped
    command: ["maintenance"]
    env_file:
      - .env.production
      - .env.migrate
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS_CA_FILE: /tls/ca.crt
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
    volumes:
      - ./secrets/redis-tls/ca.crt:/tls/ca.crt:ro
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend, egress]        # Redis; Postgres
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  # The timer for scheduled work (backend/celery_app.py's beat_schedule): it only
  # queues the career-site, JD health check and maintenance ticks; workers run them.
  # Exactly one: two would tick twice (harmless, since every tick re-checks what is
  # due, but pointless). Its schedule state is scratch: on start it ticks everything
  # once anyway, so nothing is lost when the container is replaced.
  beat:
    image: ${JHA_IMAGE:?set JHA_IMAGE}
    restart: unless-stopped
    command: ["beat"]                  # schedule state on the tmpfs (docker-entrypoint.sh)
    env_file: .env.production
    environment:
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_TLS_CA_FILE: /tls/ca.crt
      APP_ENV: production
      APP_MODE: hosted                 # backend/app_mode.py: no writes to the container, downloads not server folders
    volumes:
      - ./secrets/redis-tls/ca.crt:/tls/ca.crt:ro
    read_only: true                    # the image writes nothing outside /tmp (Dockerfile)
    tmpfs: [/tmp]
    init: true                         # reaps child processes (Chromium's, in the worker)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend]                # Redis only: it never touches the database
    depends_on:
      redis:
        condition: service_healthy

networks:
  # Caddy <-> app only. The subnet is fixed so Caddy can have a fixed address, which is
  # what the app's TRUSTED_PROXIES names.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/29
  # app, workers and Redis. `internal: true` means containers here have no route to
  # the outside world, so a compromised Redis cannot call out and nothing outside can
  # reach it. app/worker also join `egress` for their own outbound calls.
  backend:
    internal: true
  # Outbound access only (no published ports live on this network).
  egress: {}

volumes:
  caddy_data:
  caddy_config:
  redis_data:
